name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: TypeScript (check + test + build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm exec eslint .
      # Every program the renderer builds, compiled and linked in a real WebGL2
      # context (software-rendered): nothing above can tell a shader that is
      # type-checked and unit-tested from one the browser will refuse.
      - name: Compile shaders
        run: |
          pnpm --filter @llr/web check:shaders
          google-chrome --headless=new --no-sandbox --enable-unsafe-swiftshader --use-angle=swiftshader \
            --virtual-time-budget=10000 --dump-dom "file://$PWD/apps/web/shader-check.html" > shader-check.txt
          grep -E "^(OK|FAIL|LINK|NO WEBGL2|DONE)" shader-check.txt || true
          grep -q "DONE failures=0" shader-check.txt

  worker:
    name: Python worker (test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project apps/worker
      - run: uv run --project apps/worker python -m compileall -q apps/worker/src
      - run: uv run --project apps/worker pytest -q apps/worker/tests
      - run: uv run --project apps/worker ruff check apps/worker
