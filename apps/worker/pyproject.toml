[project]
name = "llr-worker"
version = "0.1.0"
description = "Python worker for RAW preview, export, and camera-preview matching."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pillow>=11.0.0",
  "rawpy>=0.25.0"
]

[project.scripts]
llr-worker = "llr_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llr_worker"]
