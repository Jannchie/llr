[project]
name = "llr-worker"
version = "0.1.0"
description = "Python worker for RAW preview, export, and camera-preview matching."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pillow>=11.0.0",
  "rawpy>=0.25.0",
  "scikit-image>=0.24.0",
  "pywavelets>=1.6.0"
]

# The neural denoise backend is deferred and nothing imports torch yet (the
# denoise module loads it lazily), so keep the multi-GB CUDA wheels out of the
# default environment: uv sync --project apps/worker --extra neural
[project.optional-dependencies]
neural = ["torch>=2.6.0"]

[dependency-groups]
dev = ["ruff>=0.9.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness-focused: pycodestyle errors, pyflakes, bugbear, comprehensions,
# import sorting. No stylistic churn.
select = ["E4", "E7", "E9", "F", "B", "C4", "I"]

[project.scripts]
llr-worker = "llr_worker.cli:main"

# PyTorch CUDA wheels (RTX 3090 / Ampere).
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llr_worker"]
