[project]
name = "llr-worker"
version = "0.1.0"
description = "Python worker for RAW preview, export, and camera-preview matching."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pillow>=11.0.0",
  "rawpy>=0.25.0",
  "pywavelets>=1.6.0",
  "numba>=0.67.0",
  # Generative erase (erase.py). DirectML runs it on any DX12 GPU without a CUDA
  # install and is as fast as the CUDA provider for this model; elsewhere the
  # plain runtime is the fallback (CPU, about four minutes a fill — install
  # onnxruntime-gpu in its place for a GPU).
  "onnxruntime-directml>=1.20; sys_platform == 'win32'",
  "onnxruntime>=1.20; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["ruff>=0.9.0", "pytest>=8.3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Correctness-focused: pycodestyle errors, pyflakes, bugbear, comprehensions,
# import sorting, pyupgrade, simplify, ruff-specific. No stylistic churn.
select = ["E4", "E7", "E9", "F", "B", "C4", "I", "UP", "SIM", "RUF"]

[project.scripts]
llr-worker = "llr_worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llr_worker"]
